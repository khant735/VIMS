name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install LLVM-MinGW
        shell: pwsh
        run: |
          $url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-ucrt-x86_64.zip'
          Invoke-WebRequest $url -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath deps
          $root = (Get-ChildItem deps -Directory | Select-Object -First 1).FullName
          "LLVM_MINGW_ROOT=$root" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $url = 'https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkan_sdk.exe'
          Invoke-WebRequest $url -OutFile VulkanSDK.exe
          Start-Process .\VulkanSDK.exe -ArgumentList '--accept-licenses --default-answer --confirm-command install' -Wait
          $sdk = 'C:\VulkanSDK\1.4.357.0'
          if (-not (Test-Path "$sdk\Include\vulkan\vulkan.h")) { throw 'Vulkan SDK installation failed' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV

      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-win-x64-1.30.0.zip'
          Invoke-WebRequest $url -OutFile onnxruntime.zip
          Expand-Archive onnxruntime.zip -DestinationPath deps
          $root = (Resolve-Path 'deps\onnxruntime-win-x64-1.30.0').Path
          "ONNXRUNTIME_ROOT=$root" >> $env:GITHUB_ENV

      - name: Install DirectML
        shell: pwsh
        run: |
          $url = 'https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4'
          Invoke-WebRequest $url -OutFile directml.nupkg
          Copy-Item directml.nupkg directml.zip
          Expand-Archive directml.zip -DestinationPath deps\directml
          $dll = Get-ChildItem deps\directml -Recurse -Filter DirectML.dll |
            Where-Object { $_.FullName -match 'win-x64|x64' } |
            Select-Object -First 1
          if (-not $dll) { throw 'x64 DirectML.dll not found in Microsoft.AI.DirectML 1.15.4 package' }
          "DIRECTML_DLL=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Compile render-test shaders
        shell: pwsh
        run: |
          $glslc = 'C:\VulkanSDK\1.4.357.0\Bin\glslc.exe'
          if (-not (Test-Path $glslc)) { throw 'Vulkan glslc compiler missing' }
          & $glslc src\cog.vert -o src\cog.vert.spv
          if ($LASTEXITCODE -ne 0) { throw 'cog.vert shader compilation failed' }
          & $glslc src\cog.frag -o src\cog.frag.spv
          if ($LASTEXITCODE -ne 0) { throw 'cog.frag shader compilation failed' }
          & $glslc src\hud.vert -o src\hud.vert.spv
          if ($LASTEXITCODE -ne 0) { throw 'hud.vert shader compilation failed' }
          & $glslc src\hud.frag -o src\hud.frag.spv
          if ($LASTEXITCODE -ne 0) { throw 'hud.frag shader compilation failed' }
          # The renderer loads these beside the executable at runtime.
          New-Item -ItemType Directory -Force -Path build\Release | Out-Null
          Copy-Item src\cog.vert.spv,src\cog.frag.spv,src\hud.vert.spv,src\hud.frag.spv build\Release -Force

      - name: Publish current calibration shaders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime-shaders | Out-Null
          Copy-Item src\cog.vert.spv,src\cog.frag.spv runtime-shaders -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-shaders/cog.vert.spv runtime-shaders/cog.frag.spv
          if (-not (git diff --cached --quiet)) {
            git commit -m "Update compiled Vulkan calibration shaders [skip ci]"
            git push origin HEAD:main
          }

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Validate runtime files
        shell: pwsh
        run: |
          $out = 'build\Release'
          Copy-Item $env:DIRECTML_DLL $out -Force
          Copy-Item assets\cog_wood.ppm,assets\cog_resin.ppm,assets\spindle_metal.ppm $out -Force
          $required = @(
            "$out\VulkanImageMaskStudio.exe",
            "$out\cog.vert.spv",
            "$out\cog.frag.spv",
            "$out\cog_wood.ppm",
            "$out\cog_resin.ppm",
            "$out\spindle_metal.ppm",
            "$out\libc++.dll",
            "$out\libunwind.dll",
            "$out\onnxruntime.dll",
            "$out\DirectML.dll"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Required release file missing: $file" }
          }

      - name: Generate distribution file change list
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'build/Release'
          # Stage everything before hashing; the report itself is excluded to
          # avoid a self-referential hash.
          Copy-Item download_models.ps1,Download_VIMS_Shaders.ps1,Update_VIMS.ps1 $out -Force
          Copy-Item models $out -Recurse -Force
          Copy-Item LICENSE,THIRD_PARTY.md $out -Force
          New-Item -ItemType Directory -Force -Path distribution-manifests | Out-Null
          $latest = 'distribution-manifests/latest.tsv'
          if (Test-Path $latest) { Copy-Item $latest 'distribution-manifests/previous.tsv' -Force }
          else { Set-Content 'distribution-manifests/previous.tsv' -Value @() -Encoding utf8 }
          $previous = @{}
          if (Test-Path $latest) {
            Get-Content $latest | ForEach-Object {
              $fields = $_ -split "`t", 2
              if ($fields.Count -eq 2) { $previous[$fields[0]] = $fields[1] }
            }
          }
          $current = @{}
          Get-ChildItem $out -Recurse -File | Where-Object { $_.Name -ne 'DISTRIBUTION_CHANGE_LIST.txt' } | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path $out).Path.Length + 1).Replace([char]92,'/')
            $current[$relative] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $lines = @('VIMS DISTRIBUTION FILE CHANGE LIST', "Build commit: $env:GITHUB_SHA",
                     'SHA-256 hashes of staged files, compared with the previous successful published manifest.',
                     'Status | Relative path | SHA-256', '')
          if ($previous.Count -eq 0) {
            $lines += 'BASELINE: No previous successful distribution manifest was available.'
          }
          foreach ($name in @($current.Keys | Sort-Object)) {
            $state = if (-not $previous.ContainsKey($name)) { 'ADDED' } elseif ($previous[$name] -ne $current[$name]) { 'MODIFIED' } else { 'UNCHANGED' }
            $lines += "$state | $name | $($current[$name])"
          }
          foreach ($name in @($previous.Keys | Where-Object { -not $current.ContainsKey($_) } | Sort-Object)) {
            $lines += "REMOVED | $name | (previous: $($previous[$name]))"
          }
          $lines += ''
          $lines += 'Note: DISTRIBUTION_CHANGE_LIST.txt is excluded from its own hash manifest.'
          $lines | Set-Content "$out/DISTRIBUTION_CHANGE_LIST.txt" -Encoding utf8
          @($current.Keys | Sort-Object | ForEach-Object { "$_`t$($current[$_])" }) |
            Set-Content 'distribution-manifests/latest.tsv' -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          $out = 'build\Release'
          Copy-Item download_models.ps1,Download_VIMS_Shaders.ps1 $out -Force
          Copy-Item models $out -Recurse -Force
          Copy-Item LICENSE,THIRD_PARTY.md $out -Force
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'development' }
          $baseZip = "VIMS-$version-Windows-x64.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $baseZip -CompressionLevel Optimal -Force
          # CRC32 is used as a short, visible build identifier; SHA-256 remains the integrity hash.
          $crcTable = 0..255 | ForEach-Object {
            $c = [uint32]$_
            1..8 | ForEach-Object { if ($c -band 1) { $c = [uint32](0xEDB88320L -bxor ($c -shr 1)) } else { $c = $c -shr 1 } }
            $c
          }
          $crc = [uint32]0xFFFFFFFFL
          $stream = [IO.File]::OpenRead($baseZip)
          try {
            $buffer = New-Object byte[] 1048576
            while (($count = $stream.Read($buffer,0,$buffer.Length)) -gt 0) {
              for ($i=0; $i -lt $count; $i++) { $crc = [uint32]($crcTable[($crc -bxor $buffer[$i]) -band 0xFF] -bxor ($crc -shr 8)) }
            }
          } finally { $stream.Dispose() }
          $crc = [uint32]($crc -bxor 0xFFFFFFFFL)
          $crc32 = $crc.ToString('X8')
          $zip = "VIMS-$version-Windows-x64-$crc32.zip"
          Move-Item -LiteralPath $baseZip -Destination $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          "$crc32  $zip" | Set-Content "$zip.crc32" -Encoding ascii
          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV
          "RELEASE_CRC32=$crc32" >> $env:GITHUB_ENV

      - name: Publish public incremental update assets
        if: github.ref_type != 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'build/Release'
          $old = @{}
          if (Test-Path 'distribution-manifests/previous.tsv') {
            Get-Content 'distribution-manifests/previous.tsv' | ForEach-Object {
              $v = $_ -split "`t",2
              if ($v.Count -eq 2) { $old[$v[0]] = $v[1] }
            }
          }
          $changed = @()
          Get-Content 'distribution-manifests/latest.tsv' | ForEach-Object {
            $v = $_ -split "`t",2
            if ($v.Count -eq 2 -and (!$old.ContainsKey($v[0]) -or $old[$v[0]] -ne $v[1])) { $changed += $v[0] }
          }
          New-Item -ItemType Directory -Force -Path 'update-stage' | Out-Null
          foreach ($file in $changed) {
            $src = Join-Path $out $file
            $dst = Join-Path 'update-stage' $file
            New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent) | Out-Null
            Copy-Item -LiteralPath $src -Destination $dst -Force
          }
          if ($changed.Count -eq 0) {
            Set-Content 'update-stage/NO_CHANGES.txt' 'No changed files' -Encoding ascii
          }
          Compress-Archive -Path 'update-stage/*' -DestinationPath 'VIMS-Update-Files.zip' -Force
          Compress-Archive -Path "$out/*" -DestinationPath 'VIMS-Full-Windows-x64.zip' -Force
          Copy-Item 'distribution-manifests/latest.tsv' 'distribution-manifest.tsv'
          Copy-Item 'distribution-manifests/previous.tsv' 'distribution-previous.tsv'
          gh release view development-latest --repo khant735/VIMS *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create development-latest --repo khant735/VIMS --title 'Development auto-update channel' --notes 'Latest successful Windows development build. Files are hash-verified by VIMS updater.' --prerelease
          }
          gh release upload development-latest 'VIMS-Update-Files.zip' 'VIMS-Full-Windows-x64.zip' 'distribution-manifest.tsv' 'distribution-previous.tsv' --clobber --repo khant735/VIMS
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish update assets' }

      - name: Publish distribution hash manifest
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution-manifests/latest.tsv
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record successful distribution file hashes [skip ci]"
            git push origin HEAD:main
          }

      - name: Upload executable-only artifact
        uses: actions/upload-artifact@v6
        with:
          name: VIMS-${{ github.ref_type == 'tag' && github.ref_name || 'development' }}-Windows-x64-EXE-${{ env.RELEASE_CRC32 }}
          path: build/Release/VulkanImageMaskStudio.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: VIMS-${{ github.ref_type == 'tag' && github.ref_name || 'development' }}-Windows-x64-${{ env.RELEASE_CRC32 }}
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_ZIP }}.sha256
            ${{ env.RELEASE_ZIP }}.crc32
          compression-level: 0

      - name: Publish tagged release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_ZIP }}.sha256
            ${{ env.RELEASE_ZIP }}.crc32
          generate_release_notes: true
